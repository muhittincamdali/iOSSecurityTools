# XcodeGen spec for SecurityLab.xcodeproj. The project file is committed, so XcodeGen is
# only needed after changing this file: run `xcodegen` in this folder.
name: SecurityLab
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  iOSSecurityTools:
    path: ../..
targets:
  SecurityLab:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [SecurityLab]
    dependencies:
      - package: iOSSecurityTools
        product: iOSSecurityTools
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Security Lab
        INFOPLIST_KEY_NSFaceIDUsageDescription: Security Lab asks for Face ID to show protected values.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing identity.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The pinning screen connects to a server from the Mac app as well.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  SecurityLabTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - SecurityLabTests
      # The package's keychain suites, run here inside a signed app: a test bundle without a host
      # app has no keychain entitlement on the simulator.
      - path: ../../Tests/iOSSecurityToolsTests/KeychainTests.swift
      - path: ../../Tests/iOSSecurityToolsTests/SecureEnclaveTests.swift
    dependencies:
      - target: SecurityLab
      - package: iOSSecurityTools
        product: iOSSecurityTools
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecurityLab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SecurityLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SecurityLab:
    build:
      targets:
        SecurityLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SecurityLabTests
